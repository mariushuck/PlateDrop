# Entwicklung. Wird von `docker compose up` automatisch mitgeladen.
services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  # Baut im Dev-Modus dieselbe Stage wie `web`, damit nur EIN Image entsteht.
  migrate:
    build:
      target: dev
    volumes:
      - .:/app
      - /app/node_modules

  web:
    build:
      target: dev
    environment:
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - "3000:3000"
    volumes:
      # Quellcode live einbinden, aber Container-eigene node_modules und
      # .next behalten (macOS-Bind-Mounts sind sonst quälend langsam).
      - .:/app
      - /app/node_modules
      - /app/.next
      - proofs:/data/proofs
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
