name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Öffentliches Repo: der Token darf nur lesen, auch falls der Repo-Default
# einmal gelockert wird. Kein Job schreibt ins Repo.
permissions:
  contents: read

# Ältere Läufe desselben Branches/PRs abbrechen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dummy-Werte nur für `next build` / Unit-Tests – keine echten Secrets.
  DATABASE_URL: postgres://platedrop_app:ci@localhost:5432/platedrop
  RATE_LIMIT_SALT: ci-only-salt
  BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-1234
  BETTER_AUTH_URL: http://localhost:3000

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  integration:
    runs-on: ubuntu-latest
    services:
      db-test:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: platedrop_test
          POSTGRES_USER: platedrop_owner
          POSTGRES_PASSWORD: test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U platedrop_owner -d platedrop_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mailpit-test:
        image: axllent/mailpit:latest
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: 1
          MP_SMTP_AUTH_ALLOW_INSECURE: 1
        ports:
          - 51025:1025
          - 58025:8025
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Bricht bei bekannten Schwachstellen ab high aufwärts.
      - run: pnpm audit --audit-level high

  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks-action liest bei Pull Requests die PR-Commits über die API.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
