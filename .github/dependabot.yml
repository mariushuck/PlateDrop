version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Patch-/Minor-Updates gebündelt, damit nicht jede Bibliothek einen
      # eigenen PR aufmacht.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Die Typen folgen der Node-Major im Dockerfile und in der CI (22), nicht
      # der neuesten Node-Version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
